project_id = "caedm-software-hub"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = ["http://localhost:3100/auth/callback", "http://localhost:3100/auth/callback?next=/auth/update-password", "http://localhost:3100/auth/confirm", "http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/auth/update-password", "http://localhost:3000/auth/confirm"]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created"